version: 2
updates:
  # The engine has no third-party dependencies. The command line tool has
  # one, Swift Argument Parser.
  - package-ecosystem: swift
    directory: /RhinoCore
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
