name: Feature request
description: Something Rhino doesn't do yet
labels: [feature, needs triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation, not the solution. What the script or the automation is for, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could look from outside, as a line of script, a header tag or a screen. A sketch is enough.
      placeholder: |
        // @schedule first monday of the month at 09:00
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead for now
      description: A workaround tells us how much this matters, and sometimes it is the answer.
  - type: checkboxes
    id: checked
    attributes:
      label: Before you send it
      options:
        - label: I looked for it in docs/WRITING-SCRIPTS.md and in the open issues
        - label: I'd be willing to open a pull request for it
